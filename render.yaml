services:
  - type: web
    name: lsnb-alumni-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: lsnb-alumni-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: FRONTEND_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false

  # Independent job: runs even when the free API service is asleep.
  # Second run recovers an interrupted job after the 15-minute DB lease expires.
  # It reuses the same edition and never repeats an attempted OpenAI request.
  - type: cron
    name: lsnb-alumni-highlights
    runtime: node
    rootDir: api
    plan: starter
    schedule: "0,20 0 * * 1"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run highlights:generate
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-nano

